; 复制本文件内容到 Godot 自动生成的 user://ai/ai_settings.cfg 后编辑。
; macOS 默认位置：
; ~/Library/Application Support/Godot/app_userdata/组合出招：第一阶段纵切/ai/ai_settings.cfg
; 配置修改后请重启游戏。API Key 会以明文保存在本机配置文件中。

[remote_ai]

enabled=false

[provider]

provider_id="deepseek"
api_style="openai_chat_completions"
base_url="https://api.deepseek.com"
path="/chat/completions"
api_key=""
model="deepseek-v4-flash"
thinking_enabled=true
reasoning_effort="medium"
timeout_msec=30000
max_tokens=256

[conversation]

compression_enabled=true
compression_interval_rounds=5
max_retries=1
intent_visibility="full"

[storage]

autosave_conversation=true
conversation_directory="user://ai/conversations"
autosave_decision_trace=true
decision_trace_directory="user://ai/traces"
